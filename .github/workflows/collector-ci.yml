name: Collector tests

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/collector-ci.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: collector
        run: npm install
      - name: Run normalizer tests
        working-directory: collector
        run: npm test
      - name: Check JavaScript syntax
        working-directory: collector
        run: node --check src/index.js

      - name: Check Worker syntax
        run: node --check cloudflare/src/index.js
      - name: Validate D1 migrations
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(pathlib.Path("cloudflare/migrations/0001_initial.sql").read_text())
          db.executescript(pathlib.Path("cloudflare/migrations/0002_market_feed_events.sql").read_text())
          print("D1 migrations are valid")
          PY
